满意占比更高。Q18/Q21存在题目级缺失，分母按实际有效回答计算。"}, {"title": "潜在用户对进深更敏感，宽高仍以适中为主", "text": "Q20进深适中，现有22/35（62.9%）、潜在15/24（62.5%）；进深偏短（非常短/有点短）现有9/35（25.7%）、潜在9/24（37.5%）。宽度适中现有21/35（60.0%）、潜在16/24（66.7%）；高度适中现有22/35（62.9%）、潜在17/24（70.8%）。潜在层的进深偏短反馈更集中，但Q20仅覆盖进入尺寸深问的样本。"}, {"title": "潜在需求偏日常冷冻食品，现有用户更偏户外/钓获物", "text": "冷冻食品潜在131/169（77.5%）、现有63/94（67.0%）；钓获物潜在21/169（12.4%）、现有25/94（26.6%）。这提示潜在用户的进入场景更偏家庭补给，现有用户更偏户外活动。"}, {"title": "日本家电品牌是潜在用户的认知入口", "text": "潜在队列关注 IRIS OHYAMA 为119/169（70.4%）、YAMAZEN 为94/169（55.6%）、Anker 为85/169（50.3%）；现有用户对 EENOUR 为33/94（35.1%），高于潜在21/169（12.4%）。这提示‘日本家电/大品牌认知→专业车载冰箱转化’值得单独验证。"}, {"title": "日本市场信号：不是只有露营", "text": "长途自驾/旅行/家庭出游为 182/263（69.2%）；超市购物后保冷为 134/263（51.0%）；几乎每天遇到低温保存需求为 129/263（49.0%）。产品场景应覆盖日常补给与旅行。"}, {"title": "20L左右是容量甜点", "text": "Q7中20–21L关注人数为 85/263（32.3%）；Q15一次携带3–4人份为 126/263（47.9%）。Q19开放题全角归一化并清洗后，现有用户中位数20.0L、潜在用户22.5L（潜在有效数字仅22条），存在异常值，需谨慎解读。"}, {"title": "转化要先解决性能与价值解释", "text": "潜在关注队列中，价格是未购买首因；当前方式的长时间低温不足、高温保冷下降也是高频痛点。现有方式正向满意度为描述性比较指标，详见‘当前方式与痛点’页。"}], "interpretations": [{"title": "从保冷箱到电制冷：潜在用户处于替代升级阶段", "text": "Q18中，潜在关注队列使用硬/软保冷箱合计60/82（73.2%），电制冷合计仅5/82（6.1%）；现有用户则分别为21/51（41.2%）和22/51（43.1%）。结合Q22中潜在用户对“长时间低温不足”（79/155（51.0%））和“高温保冷下降”（77/155（49.7%））的反馈，潜在需求更像是对现有保冷箱的性能升级，而不是从零教育。"}, {"title": "容量是入口，尺寸/重量是落地约束", "text": "潜在用户Q24最关注容量（143/169（84.6%）），但Q25首位排序的前三项是容量（26/67，38.8%）、品牌（12/40，30.0%）和产品尺寸（10/36，27.8%）。因此传播先用容量筛选，再用尺寸、重量和车内适配降低决策阻力。"}, {"title": "性能承诺必须同时回应价格与用车风险", "text": "潜在用户未购买首因是价格较高（95/169（56.2%））；第二层顾虑是车辆电瓶亏电（44/169（26.0%））。与此同时，Q22中长时间低温不足（79/155（51.0%））和高温环境保冷下降（77/155（49.7%））均接近半数。产品页面需要把制冷效果、断电/电瓶保护、能耗和总拥有成本放在同一组证据中，而非只强调降温速度。"}, {"title": "搜索路径呈现“搜索验证→电商比较→视频确认”", "text": "Q23潜在用户主要通过搜索引擎（114/169（67.5%））和综合电商平台（81/169（47.9%））了解产品，视频平台为54/169（32.0%）。这与Q24对容量（143/169（84.6%））、重量（83/169（49.1%））和产品尺寸（82/169（48.5%））的高关注一致，说明内容应提供可检索的规格对比，并用真实场景视频验证体积、噪音和搬运。"}, {"title": "本样本的需求不是单一露营场景，而是日常补给叠加出行", "text": "Q10中长途自驾/旅行/家庭出游为182/263（69.2%），超市购物后保冷为134/263（51.0%）；Q14中非酒精饮料（212/263（80.6%））、冷冻食品（194/263（73.8%））和生鲜肉类/海鲜（199/263（75.7%））都处于高位，且Q13“几乎每天”为129/263（49.0%）。因此产品场景应覆盖家庭日常补给与旅行携带，而不只围绕露营传播。"}], "interpretations_ja": [{"title": "クーラーから電気冷却へ：潜在層は代替手段のアップグレード段階", "text": "Q18では、潜在関心層のハード／ソフトクーラー合計は60/82（73.2%）で、電気冷却は5/82（6.1%）にとどまります。現在利用者はそれぞれ21/51（41.2%）、22/51（43.1%）です。Q22で潜在層が長時間の低温維持不足（79/155（51.0%））と高温時の保冷低下（77/155（49.7%））を挙げており、ゼロからの認知形成より既存クーラーの性能アップグレードとして説明する方が自然です。"}, {"title": "容量は入口、サイズと重量が実装上の制約", "text": "潜在関心層のQ24で容量が最多（143/169（84.6%））ですが、Q25の1位は容量（26/67、38.8%）、ブランド（12/40、30.0%）、製品サイズ（10/36、27.8%）です。容量で入口を作り、サイズ・重量・車内適合性で不安を下げる構成が示唆されます。"}, {"title": "性能訴求は価格と車両リスクを同時に解消する必要がある", "text": "未購入理由の最多は価格（95/169（56.2%））で、次にバッテリー上がりへの懸念（44/169（26.0%））です。一方、Q22では長時間の低温維持不足（79/155（51.0%））と高温時の保冷低下（77/155（49.7%））がともに約半数です。冷却性能、電源保護、消費電力、総保有コストを同じ証拠セットで示す必要があります。"}, {"title": "情報収集は「検索で確認→EC比較→動画で納得」", "text": "Q23で潜在関心層が使うチャネルは検索エンジン（114/169（67.5%））、総合EC（81/169（47.9%））、動画（54/169（32.0%））の順です。Q24の容量（143/169（84.6%））、重量（83/169（49.1%））、製品サイズ（82/169（48.5%））への関心と整合し、仕様比較と実走動画の組合せが有効です。"}, {"title": "本サンプルの需要はキャンプ単独ではなく、日常の買い物と外出の重なり", "text": "Q10では長距離ドライブ・旅行・家族のお出かけが182/263（69.2%）、買い物後の保冷が134/263（51.0%）です。Q14ではノンアルコール飲料（212/263（80.6%））、冷凍食品（194/263（73.8%））、生鮮肉・魚介（199/263（75.7%））が高く、Q13で「ほぼ毎日」は129/263（49.0%）です。キャンプだけでなく、家庭の買い置きと旅行の両方を想定した訴求が必要です。"}], "definition_ja": "全体ではQ1をスクリーニングに使用し、詳細プロファイルはQ4〜Q34の対象ルートを集計しています。現在利用者はQ1でコンプレッサー式またはペルチェ式の車載冷蔵庫を選択した人、潜在関心層はQ2で車載・ポータブル冷蔵庫を選択し、現在利用者として識別されなかった人です。Q1の18〜26列がすべて空欄の1人は欠損として別掲し、主集計では車載冷蔵庫の選択なしとして潜在層に含めています。Q1判定可能な感度分析も併記しています。Pollfishの一部選択肢は未取得のため、分母は設問ブロックの行単位有効回答数です。", "insights_ja": [{"title": "サンプルはセグメント別に読む必要がある", "text": "全体は996人、Q4〜Q34の詳細対象ルートは263人で、現在利用者94人、潜在関心層169人です。Q1ブロックが全て空欄の1人はPollfish由来で、主集計では潜在層に含め、Q1判定可能な感度分析（n=168）も残しています。"}, {"title": "プラットフォーム構成と回答ルートの差が大きく、市場全体へ外挿できない", "text": "Q1コンプレッサー式／ペルチェ式の現在利用率：Prolific 28/504（5.6%）；Positly 35/362（9.7%）；Pollfish 43/129（33.3%）。Q2車載・ポータブル冷蔵庫の関心率：Prolific 66/449（14.7%）；Positly 21/224（9.4%）；Pollfish 130/130（100.0%）。3プラットフォームの構成とルートが異なるため、統合値は未加重サンプルの記述であり、日本市場全体の普及率とはみなせません。"}, {"title": "需要は冷蔵と日常の持ち運びが中心", "text": "詳細対象ルートでは、長距離ドライブ・旅行・家族のお出かけ／帰省が最多（182/263（69.2%））。非アルコール飲料が最も多い低温食品（212/263（80.6%））で、Q13は「ほぼ毎日」が129/263（49.0%）です。"}, {"title": "潜在関心層の最大の障壁は価格", "text": "Q2の潜在関心層（n=169、Q1ブロック全空欄1人を含む）では、価格の高さが最多（95/169、56.2%）です。長時間の低温維持と高温環境での性能も主な課題です。"}, {"title": "容量は関心率と1位率がともに最高", "text": "潜在関心層で容量を確認した人は143/169（84.6%）。Q25で容量を1位にしたのは26/67（条件38.8%、潜在全体の31.7%）、ブランドは12/40（条件30.0%）でした。Q25は要素ごとに分母が異なるため、選択率・条件付き1位率・全体カバー率を併読します。"}, {"title": "潜在関心層は冷凍保持時間が長く、場面で判断する人も多い", "text": "冷凍4〜12時間は現在利用者47/94（50.0%）、潜在関心層38/169（22.5%）。冷凍12時間以上は現在利用者16/94（17.0%）、潜在関心層52/169（30.8%）。時間が一定でない／場面による回答は現在利用者11/94（11.7%）、潜在関心層48/169（28.4%）です。未加重の記述差であり、母集団の有意差検定ではありません。"}, {"title": "潜在関心層は小容量寄り、現在利用者は大容量を扱う", "text": "1回の保冷品が10L以下は現在利用者27/94（28.7%）、潜在関心層82/169（48.5%）。31L以上は現在利用者26/94（27.7%）、潜在関心層9/169（5.3%）です。11〜30Lは近く、20L前後が両層をつなぐ容量帯になり得ます。"}, {"title": "潜在関心層はクーラーが中心、現在利用者は2方式が拮抗", "text": "Q18の有効回答は現在利用者51件、潜在関心層82件です。コンプレッサー／ペルチェ式の合計は現在利用者22/51（43.1%）、潜在関心層5/82（6.1%）。ハード／ソフトクーラーの合計は現在利用者21/51（41.2%）、潜在関心層60/82（73.2%）です。現在利用者では2方式が近く、電気式がわずかに高い一方、潜在関心層ではクーラーが明確に中心です。"}, {"title": "潜在関心層は現在の代替手段への満足度が低い", "text": "Q21で「満足」と答えた割合は現在利用者56/92（60.9%）、潜在関心層63/155（40.6%）。潜在関心層は中立・不満の割合が高く、Q18／Q21は設問単位の欠損を含むため実効分母で計算しています。"}, {"title": "潜在層は奥行きに敏感で、幅と高さは適正が中心", "text": "Q20で奥行きが適正と答えた割合は現在利用者22/35（62.9%）、潜在関心層15/24（62.5%）。短い（非常に短い／やや短い）は現在利用者9/35（25.7%）、潜在関心層9/24（37.5%）です。幅の適正は現在利用者21/35（60.0%）、潜在関心層16/24（66.7%）、高さの適正はそれぞれ22/35（62.9%）、17/24（70.8%）です。Q20は寸法詳細設問に進んだ回答者のみが対象です。"}, {"title": "潜在需要は日常の冷凍食品、現在利用者は屋外・釣果寄り", "text": "冷凍食品は潜在関心層131/169（77.5%）、現在利用者63/94（67.0%）。釣果は潜在関心層21/169（12.4%）、現在利用者25/94（26.6%）で、潜在層は家庭の買い置き、現在利用者は屋外活動に寄る示唆があります。"}, {"title": "日本の家電ブランドが潜在関心層の認知入口", "text": "潜在関心層の注目率はIRIS OHYAMA 119/169（70.4%）、YAMAZEN 94/169（55.6%）、Anker 85/169（50.3%）。EENOURは現在利用者33/94（35.1%）で、潜在関心層21/169（12.4%）を上回ります。日本家電・大手ブランドの認知から専門車載冷蔵庫への転換を別途検証できます。"}, {"title": "日本市場の示唆：キャンプだけではない", "text": "長距離ドライブ・旅行・家族のお出かけ／帰省は182/263（69.2%）、買い物後の保冷は134/263（51.0%）、低温保存の頻度が「ほぼ毎日」は129/263（49.0%）。日常の買い置きと旅行の両方を想定した場面設計が必要です。"}, {"title": "20L前後が容量の中心帯", "text": "Q7で20〜21Lを調べた人は85/263（32.3%）、Q15で3〜4人分を想定した人は126/263（47.9%）。Q19自由記述を全角正規化し、外れ値を除いた中央値は現在利用者20.0L、潜在関心層22.5L（潜在層の有効数値は22件）です。外れ値があるため慎重に解釈します。"}, {"title": "転換には性能と価値の説明が必要", "text": "潜在関心層の未購入理由では価格が最多です。現在の方法では長時間の低温維持不足や高温時の保冷低下も頻出します。現在の方法の満足度は記述比較として「現在の方法と課題」ページに掲載しています。"}], "i18n": {"压缩机式车载冰箱": "コンプレッサー式車載冷蔵庫", "半导体式车载冰箱": "ペルチェ式車載冷蔵庫", "硬质保冷箱 / Hard Cooler": "ハードクーラー / Hard Cooler", "软质保冷箱 / Cooler Bag": "ソフトクーラー / Cooler Bag", "背包式保冷箱": "リュック型クーラー", "普通家用冰箱或冷冻柜": "家庭用冷蔵庫・冷凍庫", "其他": "その他", "没有使用过以上任何方式": "上記のいずれも利用したことがない", "便携式储能电源或户外电源": "ポータブル電源またはアウトドア用電源", "车载/便携式冰箱": "車載・ポータブル冷蔵庫", "过去12个月没有关注、了解、搜索或比较过以上产品": "上記の商品について特に関心がない", "EENOUR": "EENOUR（イーノウ）", "BougeRV": "BougeRV（ボージアールブイ）", "Alpicool": "Alpicool", "EUHOMY": "EUHOMY", "KEEPJOY": "KEEPJOY", "Sumeriy": "Sumeriy", "山善（YAMAZEN）": "山善（YAMAZEN）", "IRIS OHYAMA": "アイリスオーヤマ（IRIS OHYAMA）", "Makita": "Makita（マキタ）", "SAWAFUJI / ENGEL": "澤藤電機（SAWAFUJI）/ ENGEL", "SOUYI": "SOUYI / ソウイジャパン", "SUNPIE": "SUNPIE（サンパイ）", "JESIMAIK": "JESIMAIK（ジェスマイク）", "EcoFlow": "EcoFlow（エコフロー）", "Anker": "Anker（アンカー）", "暂无关注任何品牌": "車載冷蔵庫のブランドには特に関心がない", "不知道/不记得": "わからない／覚えていない", "8L及以下": "8L以下", "9–10L": "9～10L", "11–14L": "11～14L", "15–17L": "15～17L", "18–19L": "18～19L", "20–21L": "20～21L", "22–25L": "22～25L", "26–30L": "26～30L", "31–40L": "31～40L", "41–50L": "41～50L", "51–60L": "51～60L", "61L及以上": "61L以上", "长途自驾、旅行、家庭出游或返乡": "長距離ドライブ、旅行、家族での外出、帰省", "车中泊与露营过夜": "車中泊やキャンプでの宿泊", "户外休闲活动": "アウトドアレジャー（釣り、海辺、水上アクティビティなど）", "夏日花火大会等季节性活动": "花火大会・夏祭りなどの季節イベント", "日常工作通勤": "日常の通勤", "工作用车中的长时间保冷（如快递、物流、运输配送等）": "業務用車両での長時間の保冷（宅配、物流、輸送・配送など）", "超市购物后食品携带及保冷": "スーパーなどで購入した食品の持ち運び・保冷", "家庭聚会或大量食品临时储存": "家族の集まりや大量の食品の一時保管", "停电或防灾备用": "停電や防災時の備え", "宠物出行或宠物食品携带": "ペットとの外出やペットフードの持ち運び", "没有此类需求/不记得": "このようなニーズはない／覚えていない", "瓶装水、茶、软饮等非酒精饮料": "ペットボトルの水、お茶、清涼飲料などのノンアルコール飲料", "啤酒或其他酒类": "ビールなどの酒類", "便当、熟食或即食食品": "弁当、惣菜、調理済み食品  function q19Distribution(){const a=D.current.q19_num?.bins||[],b=D.potential.q19_num?.bins||[];return `<div class="scroll"><table class="table compare-table"><tr><th>${IS_JA?'容量帯':'容量带'}</th><th>${IS_JA?'現在利用者 n/%':'现有用户 n/%'}</th><th>${IS_JA?'潜在関心層 n/%':'潜在关注 n/%'}</th></tr>${a.map((x,i)=>{const y=b[i]||{};return `<tr><td data-option-label="true">${esc(IS_JA?(x.ja||tx(x.label)):x.label)}</td><td>${x.n}/${x.d}（${x.p??'—'}%）</td><td>${y.n??0}/${y.d??0}（${y.p??'—'}%）</td></tr>`}).join('')}</table></div><div class="foot">${IS_JA?'分母は抽出・クリーニング後の有効数値回答です。':'分母为可提取且通过清洗的有效数字回答。'}${D.current.q19_num?.n_clean??0} / ${D.potential.q19_num?.n_clean??0}。${IS_JA?'抽出不能・外れ値は有効分母に含めません。':'无法提取或异常值不计入清洗后有效分母。'}</div>`}
function questionDen(pkg,key){const block=D[pkg]||{};if(block[key+'_den']!=null)return block[key+'_den'];if(key==='q6_themes')return block.q6_text?.n??'—';if(key==='q9_themes')return block.q9_text?.n??'—';return '—'}
function compareCard(key,title){let a=rows(key,'current'),b=rows(key,'potential');let all=[...new Set([...a.map(x=>x.label),...b.map(x=>x.label)])];const find=k=>a.find(z=>z.label===k)||b.find(z=>z.label===k);if(ORDER_LABELS[key]||key==='q8_capacity'||ORDERED_KEYS.has(key)){all.sort((x,y)=>orderedPosition(key,find(x))-orderedPosition(key,find(y)));}else{const score=k=>Math.max(a.find(z=>z.label===k)?.p??-1,b.find(z=>z.label===k)?.p??-1);all.sort((x,y)=>score(y)-score(x));}const foot=IS_JA?'潜在層には、Q1対象列が空欄でもQ2で車載冷蔵庫に明確な関心を示した回答者が含まれます。感度分析では「Q1判定可能な潜在層」（n=':'潜在队列包含Pollfish Q1目标列为空但Q2明确关注车载冰箱的样本；敏感性分析可见“潜在用户-Q1可判定”（n=';const highlightNote=IS_JA?'）。強調行は2群の高い方の比率で上位3水準（同率を含む）を示し、各群別の上位3ではありません。':'）。高亮行按两组中的较高占比取前三档（包含并列），不是两组各自的Top 3。';const headers=IS_JA?['選択肢','現在利用者（n=','潜在関心層（n=','潜在−現在利用者']:['选项','现有（n=','潜在关注队列（n=','潜在−现有'];const footText=foot+D.segments['潜在用户-Q1可判定']+highlightNote;return `<div class="card"><h3>${esc(title)}${openJump(key)}</h3><div class="scroll"><table class="table compare-table"><tr><th>${headers[0]}</th><th>${headers[1]}${questionDen('current',key)}）</th><th>${headers[2]}${questionDen('potential',key)}）</th><th>${headers[3]}</th></tr>${all.map(k=>{let x=a.find(z=>z.label===k)||{p:null,n:0,d:0},y=b.find(z=>z.label===k)||{p:null,n:0,d:0};let num=x.p!=null&&y.p!=null?(y.p-x.p):null;let dif=num==null?'—':num.toFixed(1)+'pp';let cls=num!=null?(num>=10?'negative':num<=-10?'positive':'delta'):'';return `<tr><td data-option-label="true">${esc(textLabel(x.p!=null?x:y))}</td><td>${x.p==null?'—':x.p+'%'} <span class="muted">(${x.n}/${x.d})</span></td><td>${y.p==null?'—':y.p+'%'} <span class="muted">(${y.n}/${y.d})</span></td><td class="${cls}">${dif}</td></tr>`}).join('')}</table></div><div class="foot">${esc(footText)}</div></div>`}
function insight(){const insights=IS_JA?(D.insights_ja||D.insights):D.insights;const interpretations=IS_JA?(D.interpretations_ja||D.interpretations):D.interpretations;const definition=IS_JA?(D.definition_ja||D.definition):D.definition;const f=D.funnel||{};const broadText=IS_JA?`広義の非現在利用者 ${f.broad_noncurrent_n??'—'}人のうち、潜在関心層は${f.potential_n??'—'}人（${f.broad_yield_p??'—'}%）。Q2有効な非現在利用者では${f.q2_noncurrent_interest_n??'—'}/${f.q2_noncurrent_den??'—'}（${f.q2_interest_p??'—'}%）で、分母により意味が変わります。`:`广义非现有样本 ${f.broad_noncurrent_n??'—'} 人中，潜在关注队列 ${f.potential_n??'—'} 人（${f.broad_yield_p??'—'}%）；若只看 Q2 有效的非现有样本，则为 ${f.q2_noncurrent_interest_n??'—'}/${f.q2_noncurrent_den??'—'}（${f.q2_interest_p??'—'}%），两种分母含义不同。`;return `<h2>先看结论</h2><div class="warn"><b>阅读口径：</b>${esc(definition)} ${esc(IS_JA?'詳細設問ブロックは996人全体ではなく、Q4〜Q34の対象ルートです。複数回答は「当該設問で少なくとも1列に有効値がある行」を分母とし、Pollfishで未取得・空欄の選択肢は該当選択肢の分母に含めません。':'详细题块不是996人的全样本，而是Q4–Q34目标路径；跨平台多选题按“该题至少有一个有效字段”的行数作分母，Pollfish未采集/空列不计入对应选项分母。')}</div><div class="grid3">${insights.map(x=>`<div class="insight"><b>${esc(x.title)}</b><br>${esc(x.text)}</div>`).join('')}</div><h2 id="home-interpretation">${IS_JA?'設問横断の解釈':'跨题解读'}</h2><p class="muted">${esc(IS_JA?'設問の前後関係をつないだ解釈です。未加重の記述差であり、日本市場全体への外挿や統計的有意差の主張ではありません。':'把前后题连接起来的证据链解读。均为本次未加权样本内的描述，不外推日本总体市场，也不主张统计显著性。')}</p><div class="grid3">${interpretations.map(x=>`<div class="insight"><b>${esc(x.title)}</b><br>${esc(x.text)}</div>`).join('')}</div><div class="grid3"><div class="card"><div class="muted">全样本 n</div><div class="kpi">${D.n}<small>人</small></div><div class="foot">Prolific ${D.platform.prolific}｜Positly ${D.platform.positly}｜Pollfish ${D.platform.pollfish}</div></div><div class="card"><div class="muted">全样本 Q1 现有用户</div><div class="kpi">${D.segments['全样现有用户']}<small> / ${D.n}（${pct(D.segments['全样现有用户'],D.n)}）</small></div><div class="foot">全样本分母996；Q1整块有效回答995；压缩机式或半导体式=1</div></div><div class="card"><div class="muted">广义非现有样本 → 潜在关注</div><div class="kpi">${D.segments['全样潜在/非现有（含Q1缺失）']} → ${D.segments['潜在用户']}<small>（${pct(D.segments['潜在用户'],D.segments['全样潜在/非现有（含Q1缺失）'])}）</small></div><div class="foot">${esc(broadText)}</div></div><div class="card"><div class="muted">深问卷目标路径</div><div class="kpi">${D.routing.detail_path_n}<small>人</small></div><div class="foot">现有 ${D.segments['现有用户']}｜潜在 ${D.segments['潜在用户']}（Q1缺失 ${D.segments['潜在用户-Q1缺失']}）</div></div></div><h2>整体筛选信号</h2><div class="grid">${multiCard('q1','Q1 实际使用过的冷藏/保冷方式','all')}${multiCard('q2','Q2 关注、了解、搜索或比较过的产品','all')}</div>`}
function screen(){let rows=D.platform?Object.entries(D.platform).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`<tr><td>${({prolific:'Prolific',positly:'Positly',pollfish:'Pollfish'}[p]||p)}</td><td>${n}/${D.n}</td><td>${pct(n,D.n)}</td></tr>`).join(''):'';return `<h2>筛选与样本结构</h2><div class="grid3"><div class="card"><div class="muted">Q1整块有回答</div><div class="kpi">${D.routing.q1_fridge_known_n}<small> / ${D.n}</small></div></div><div class="card"><div class="muted">压缩机/半导体列有值</div><div class="kpi">${D.routing.q1_target_cols_known_n}<small> / ${D.n}</small></div></div><div class="card"><div class="muted">Q1整块全空</div><div class="kpi">${D.segments['Q1缺失']}<small>（${pct(D.segments['Q1缺失'],D.n)}）</small></div></div><div class="card"><div class="muted">Q2车载/便携冰箱兴趣</div><div class="kpi">${D.routing.q2_fridge_interest_n}<small>人</small></div></div></div><div class="warn">Pollfish 的多选题常采用“选择=1、未选=空白”的稀疏编码；Q1家庭冰箱/其他/无以上等少数列为结构性空列。部分Pollfish行的压缩机/半导体目标列为空但Q1其他选项有值，按未出现现有设备选择归入潜在，并标记为路由不确定性；整块Q1全空仅${D.segments['Q1缺失']}人单独提示，并提供Q1可判定潜在敏感性 n=${D.segments['潜在用户-Q1可判定']}。</div><div class="grid">${multiCard('q1','Q1 实际使用过的方式','all')}${multiCard('q2','Q2 关注、了解、搜索或比较过的产品','all')}</div><div class="card"><h3>平台有效样本</h3><table class="table"><tr><th>平台</th><th>样本 n/整体 n</th><th>占整体</th></tr>${rows}</table></div>`}
function comparisonRows(key){const a=rows(key,'current'),b=rows(key,'potential');const all=[...new Set([...a,...b].map(x=>x.label))];const get=(arr,k)=>arr.find(z=>z.label===k)||{p:null,n:0,d:0};all.sort((u,v)=>Math.max(get(a,v).p??-1,get(b,v).p??-1)-Math.max(get(a,u).p??-1,get(b,u).p??-1));return all.map(k=>{const x=get(a,k),y=get(b,k);const d=x.p!=null&&y.p!=null?(y.p-x.p).toFixed(1)+'pp':'—';return `<tr><td data-option-label="true">${esc(textLabel(x.p!=null?x:y))}</td><td>${x.p==null?'—':x.p+'%'} (${x.n}/${x.d})</td><td>${y.p==null?'—':y.p+'%'} (${y.n}/${y.d})</td><td>${d}</td></tr>`}).join('')}
 function usage(){return `<h2 id="usage-top">需求与使用画像</h2><p class="muted">以下详细题块以目标路径样本为主（整体 n=${D.routing.detail_path_n}）；现有 vs 潜在对比使用现有 n=${D.current.q10_den??'—'}、潜在关注队列 n=${D.potential.q10_den??'—'}。</p><div class="grid">${anchor('usage-q4q5',multiCard('q4','Q4 关注/搜索过的品牌'))}${anchor('usage-q7q8',multiCard('q7','Q7 关注/搜索过的容量'))}${anchor('usage-scenario',multiCard('q10','Q10 主要使用场景'))}${singleCard('q11','Q11 冷藏/冷冻需求比例')}${singleCard('q12_cold','Q12 冷藏保持时长')}${singleCard('q12_frozen','Q12 冷冻保持时长')}${singleCard('q13','Q13 使用频率')}${multiCard('q14','Q14 常见食品/饮料')}${singleCard('q15','Q15 一次携带人数')}${singleCard('q16','Q16 一次携带体积')}${singleCard('q17','Q17 未来购买时希望携带人数')}${anchor('usage-q5',cardJump(freeTextCard('q5_brand','Q5 最先想到/重点关注品牌（开放题规则化）'),'source','open-q6','查看Q6品牌理由'))}${anchor('usage-q8',cardJump(freeTextCard('q8_capacity','Q8 最先想到/重点关注容量（开放题规则化）'),'source','open-q9','查看Q9容量理由'))}</div><div id="usage-compare" class="card"><h3>现有 vs 潜在：使用场景</h3><div class="scroll"><table class="table compare-table"><tr><th>场景</th><th>现有用户（n=${D.current.q10_den??'—'}）</th><th>潜在关注队列（n=${D.potential.q10_den??'—'}）</th><th>潜在−现有</th></tr>${comparisonRows('q10')}</table></div></div><h2>使用画像对比</h2><p class="muted">以下各题分母按题目实际有效回答计算；多选题允许一人选择多个选项。</p><div class="grid">${compareCard('q4','关注/搜索品牌')}${compareCard('q7','关注/搜索容量')}${compareCard('q5_brand','最先想到/重点关注品牌（规则化）')}${compareCard('q8_capacity','最先想到/重点关注容量（规则化）')}${compareCard('q11','冷藏/冷冻需求比例')}${compareCard('q12_cold','冷藏保持时长')}${compareCard('q12_frozen','冷冻保持时长')}${compareCard('q13','使用频率')}${compareCard('q14','常见食品/饮料')}${compareCard('q15','一次携带人数')}${compareCard('q16','一次携带体积')}${compareCard('q17','未来购买时希望携带人数')}${anchor('usage-q20',compareCard('q20_len','尺寸满意度：进深/长度（开门方向）')+compareCard('q20_wid','尺寸满意度：宽度')+compareCard('q20_high','尺寸满意度：高度'))}${compareCard('q18_method','当前主要采用方式')}${compareCard('q21','当前方式满意度')}${compareCard('q22','当前方式痛点')}</div><div id="usage-q19" class="card"><h3>Q19 Cooler 容量：现有 vs 潜在</h3><div class="scroll"><table class="table compare-table"><tr><th>群体</th><th>原始回答 n</th><th>可提取数字 n</th><th>无法提取 n</th><th>异常值数</th><th>清洗后 n</th><th>清洗后中位数</th></tr><tr><td>现有用户</td><td>${D.current.q19_num.raw_n}</td><td>${D.current.q19_num.n}</td><td>${D.current.q19_num.unparseable}</td><td>${D.current.q19_num.outliers}</td><td>${D.current.q19_num.n_clean}</td><td>${D.current.q19_num.median_clean??'—'}L</td></tr><tr><td>潜在关注队列</td><td>${D.potential.q19_num.raw_n}</td><td>${D.potential.q19_num.n}</td><td>${D.potential.q19_num.unparseable}</td><td>${D.potential.q19_num.outliers}</td><td>${D.potential.q19_num.n_clean}</td><td>${D.potential.q19_num.median_clean??'—'}L</td></tr></table></div>${q19Distribution()}${answerDetails(D.target.q19_num.answers,'','q19')}</div>`}
 function method(){const conflict=D.quality_flags?.q18_potential_conflict_n||0;return `<h2 id="method-top">当前储存方式、满意度与痛点</h2>${conflict?`<div class="warn">${IS_JA?`潜在関心層のQ18有効回答のうち${conflict}件がコンプレッサー式／ペルチェ式を回答しました。Q1のセグメント定義と一致しないため、再確認が必要です。`:`潜在关注队列的 Q18 有效回答中有 ${conflict} 人自报使用压缩机式/半导体式车载冰箱，与 Q1 分层定义不一致，保留在潜在口径并提示人工复核。`}</div>`:''}<div class="grid">${anchor('method-q18',cardJumps(singleCard('q18_method','Q18 当前主要采用的冷藏/保冷方式（原始导出为单值字段）'),[['method','method-q19','查看Q19容量'],['method','method-q20','查看Q20尺寸']]))}${anchor('method-q21',cardJump(singleCard('q21','Q21 当前方式整体满意度'),'method','method-q22','查看Q22痛点'))}${anchor('method-q20',singleCard('q20_len','Q20 尺寸满意度：进深/长度（开门方向）'))}${singleCard('q20_wid','Q20 尺寸满意度：宽度')}${singleCard('q20_high','Q20 尺寸满意度：高度')}${anchor('method-q22',multiCard('q22','Q22 当前方式遇到的问题'))}${multiCard('q23','Q23 了解/搜索车载冰箱的渠道')}</div><div id="method-q19" class="card"><h3>Q19 当前 Cooler 实际容量（开放数值）</h3><div class="grid4"><div><div class="muted">原始回答 n</div><div class="kpi">${D.target.q19_num.raw_n}</div></div><div><div class="muted">可提取数字 n</div><div class="kpi">${D.target.q19_num.n}</div></div><div><div class="muted">无法提取 n / 异常值数</div><div class="kpi">${D.target.q19_num.unparseable} / ${D.target.q19_num.outliers}</div></div><div><div class="muted">清洗后 n / 中位数</div><div class="kpi">${D.target.q19_num.n_clean} / ${D.target.q19_num.median_clean??'—'}L</div></div></div>${q19Distribution()}${answerDetails(D.target.q19_num.answers,'','q19')}<div class="foot">已做全角字符归一化；清洗排除无法提取数字及大于100L的异常值。开放题仍需人工复核后再用于产品尺寸推导。</div></div>`}
function priority(){let rank=D.potential.q25_rank||[];const q25n=rank[0]?.total_n??D.potential.q25_block_n??'—';return `<h2 id="priority-top">搜索行为与关注优先级</h2><p class="muted">Q23/Q24多数选项以潜在关注队列 n=${D.potential.q24_den??'—'} 为分母；结构性未采集选项会按字段可用平台使用更小分母（例如Q23“其他/不记得”仅在部分平台采集）。Q25排序仅在实际完成排序的因素中计算。</p><div class="grid">${anchor('priority-channels',multiCard('q23','Q23 搜索渠道（潜在关注队列）','potential'))}${anchor('priority-factors',multiCard('q24','Q24 关注因素（潜在关注队列）','potential'))}</div><div id="priority-rank" class="card"><h3>潜在用户 Q25：重要度排序分布</h3><p class="muted">排序结果有效来自已完成排序的潜在关注样本；Q25块有效 n=${q25n}，各因素分母不同，Pollfish整块未采集。下方为全部17个因素的首位率与第1–17名完整热力分布。首位率同时给出“因素有效排序”与“Q25块有效”两种分母。</p><div>${rank.map((r,ri)=>`<div class="barrow"><div data-option-label="true" class="${ri<3?'sig':''}">${esc(textLabel(r))}</div><div class="track"><div class="fill teal" style="width:${r.top1p||0}%"></div></div><div class="value ${ri<3||r.top1p>=50?'sig':''}">${r.top1p??'—'}%<br><span class="muted">条件 ${r.top1}/${r.n}；Q25有效 ${r.top1}/${r.total_n}（${r.top1_total_p}%）</span></div></div>`).join('')}</div><div class="scroll"><table class="table heat"><tr><th>因素</th>${Array.from({length:17},(_,i)=>`<th>第${i+1}名</th>`).join('')}<th>有效排序 n</th><th>第1名/Q25有效样本</th><th>平均名次</th></tr>${rank.map((r,ri)=>{let mx=Math.max(1,...Object.values(r.dist));return `<tr class="${ri<3?'sig':''}"><td data-option-label="true">${esc(textLabel(r))}</td>${Array.from({length:17},(_,i)=>i+1).map(k=>`<td><div class="cell" style="background:rgba(47,128,237,${(0.15+0.7*(r.dist[String(k)]/mx)).toFixed(2)})">${r.dist[String(k)]}</div></td>`).join('')}<td>${r.n}（首位${r.top1}，${r.top1p}%）</td><td>${r.top1}/${r.total_n}（${r.top1_total_p}%）</td><td>${r.mean}</td></tr>`}).join('')}</table></div></div><div class="card"><h3>Q24 关注率与 Q25 首位率</h3><p class="muted">同时展示潜在总体 Q24 选择率与 Q25 有效样本内 Q24 选择率，避免把不同分母混为一谈。</p><table class="table"><tr><th>因素</th><th>Q24选择率（潜在总体）</th><th>Q24选择率（Q25有效）</th><th>Q25第1名率（因素有效）</th><th>第1名/Q25有效</th><th>平均名次</th></tr>${rank.map((r,ri)=>{let q=rows('q24','potential').find(x=>x.label===r.label||x.raw_label===r.raw_label||x.ja===r.ja)||{};let qv=rows('q24_q25base','potential').find(x=>x.label===r.label||x.raw_label===r.raw_label||x.ja===r.ja)||{};return `<tr class="${ri<3?'sig':''}"><td data-option-label="true">${esc(textLabel(r))}</td><td>${q.p==null?'—':q.p+'%'} (${q.n||0}/${q.d||0})</td><td>${qv.p==null?'—':qv.p+'%'} (${qv.n||0}/${qv.d||0})</td><td>${r.top1p==null?'—':r.top1p+'%'} (${r.top1}/${r.n})</td><td>${r.top1}/${r.total_n}（${r.top1_total_p}%）</td><td>${r.mean??'—'}</td></tr>`}).join('')}</table></div><div id="priority-barrier" class="grid">${multiCard('q26','Q26 潜在用户未购买原因','potential')}${singleCard('q3','Q3 未来12个月购买可能性','potential')}${compareCard('q3','Q3 未来12个月购买可能性：现有 vs 潜在')}</div>`}

  if(byTier[i].has(name))return byTier[i].get(name);

 })}));

  return `<tr><td>Q${MATRIX_QUESTIONS[k]} ${text(zh,ja)}</td><td>${cell(a)}</td><td>${cell(b)}</td><td>${ratio(c.n,c.d)}</td><td>${low?ratio(low.n,low.d):'—'}</td></tr>`;
 }).join('');
 const conclusion=text('本次以旧分层作为主要交叉分析口径更合适，新分层作为严格高意愿的补充观察。旧中高组71人，新高组29人；Q18/Q25有效人数从20降至7，人口画像和排序容易受少数回答影响。新分层的“低/中/高”语义更清楚，但不能据此认定更能预测购买。','今回は前の分類を主なクロス集計に、新分類を厳密な高意向の補助分析に使うのが適切です。最上位層は71人から29人、Q18/Q25の有効数は20人から7人に減り、属性・順位は少数回答に左右されます。新分類の低・中・高は意味が明確ですが、購買予測力が高いとは判断できません。');
 const change=text('两套只改变51–70%档的归属：42人由旧中高组移入新中组。低组54人和无法判断7人保持一致。下表同时列出这42人的结果，以解释差异来自哪些样本。','変更は51–70%帯の所属のみで、42人が前の中高層から新しい中層へ移ります。低層54人と判定不能7人は同じです。42人の結果も併記し、差の由来を確認できます。');
 const findings=text('收紧高意愿边界后，当前方式满意率由33/68（48.5%）升至18/27（66.7%），长时间低温不足由34/68（50.0%）降至10/27（37.0%），携带/搬运不便由18/68（26.5%）升至12/27（44.4%）。高意愿并不一定源于对现有方案不满；新高组更值得探索搬运便利性需求。容量仍是关注第一位，但由60/71（84.5%）降至20/29（69.0%）。','高意向の境界を厳しくすると、現在の方法への満足は33/68（48.5%）から18/27（66.7%）、長時間の保冷不足は34/68（50.0%）から10/27（37.0%）、持ち運びの不便は18/68（26.5%）から12/27（44.4%）になります。高意向は既存手段への不満と同義ではなく、新しい高層では携帯性のニーズを探索する余地があります。容量は重視項目の1位ですが、60/71（84.5%）から20/29（69.0%）に低下します。');
 return `<section class="topic scheme-comparison" id="intent-comparison"><header class="topic-heading"><h2>${text('两套分层：哪套更适合？','2つの分類：どちらが適切か')}</h2><p class="topic-lead">${change}</p></header><div class="recommendation">${conclusion}</div><div class="card"><div class="scroll"><table class="table"><thead><tr><th>${text('比较维度','比較項目')}</th><th>${intentSchemeName('old')}</th><th>${intentSchemeName('new')}</th></tr></thead><tbody>${sampleRows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="data-note">${findings}</p><details><summary>${text('展开关键指标与51–70%移入人群的对照','主要指標と移動する51–70%層の比較を開く')}</summary><div class="scroll"><table class="table metric-comparison"><thead><tr><th>${text('指标（各组内占比）','指標（各層内の比率）')}</th><th>${text('旧中高 51–100%','前の中高 51–100%')}</th><th>${text('新高 71–100%','新しい高 71–100%')}</th><th>${text('移入新中组 51–70%','新しい中層へ移動 51–70%')}</th><th>${text('两套共同低组 0–30%','共通の低層 0–30%')}</th></tr></thead><tbody>${metricRows}</tbody></table></div><p class="foot">${text('分子/分母为各组该项人数/有效回答人数；51–70%档由旧中高减去新高逐项回算。Q18/Q25仅覆盖已采集的平台。两套最高意愿组都是Pollfish占多数，新高组还没有Prolific，平台混杂未被分层消除。推荐依据是题目覆盖与可解释性，没有实际购买结果验证预测准确性。','分子／分母は各層の該当者数／有効回答数。51–70%帯は前の中高層から新しい高層を項目ごとに差し引いて算出。Q18/Q25は取得済みプラットフォームのみ。両分類の最上位層はPollfishが多数で、新しい高層にはProlificがなく、プラットフォームの影響は解消されません。推奨は設問のカバレッジと解釈に基づき、実購買で予測精度を検証したものではありません。')}</p></details></div></section>`;
}
function intent(){
 const text=(zh,ja)=>IS_JA?ja:zh;
 const tables=spec=>spec.map(([key,zh,ja])=>intentTable(key,zh,ja)).join('');
 return intentOverview()+intentComparison()+
 intentSection('intent-factors','关注因素与优先级','重視要素と優先順位',text(`容量在三层中均为广泛关注项：低 ${intentStat('low','q24','容量')}、${intentShort('mid')} ${intentStat('mid','q24','容量')}、${intentShort('high')} ${intentStat('high','q24','容量')}。因此容量关注本身不宜作为高意愿的独有特征；需结合其他因素与优先级。`,`容量は3層とも広く重視：低 ${intentStat('low','q24','容量')}、${intentShort('mid')} ${intentStat('mid','q24','容量')}、${intentShort('high')} ${intentStat('high','q24','容量')}。容量だけを${intentShort('high')}層の固有特徴とはみなせず、他の要素と順位を合わせて確認します。`),tables([['q24','关注因素','重視要素'],['q25_rank','关注因素条件首位率','重視要素の条件付き1位率']]))+
 intentSection('intent-method','当前方式与满意度','現在の保冷方法と満足度',text(`${intentShort('high')}组对当前方式“比较/非常满意”合计 ${intentSatisfaction('high')}，低组为 ${intentSatisfaction('low')}。较高购买意愿并不等同于对现有方式不满意。Q18${intentShort('high')}组仅 ${intentDen('q18_method','high')}/${intentMeta().tiers.high.n} 人有回答。`,`現在の方法に満足・非常に満足の合計は${intentShort('high')} ${intentSatisfaction('high')}、低 ${intentSatisfaction('low')}。高い購入意向は現在の方法への不満と同義ではありません。Q18の${intentShort('high')}層は ${intentDen('q18_method','high')}/${intentMeta().tiers.high.n} 人のみです。`),tables([['q18_method','当前主要冷藏/保冷方式','現在の主な保冷方法'],['q21','当前方式整体满意度','現在の方法への総合満足度']]))+
 intentSection('intent-pain','使用痛点与购买阻碍','使用上の課題と購入障壁',text(`${intentShort('high')}组“无法长时间保持低温” ${intentStat('high','q22','无法长时间保持低温')}；未购买顾虑中“车辆电瓶亏电” ${intentStat('high','q26','担心车辆电瓶亏电')}。可围绕持续制冷和供电验证产品沟通；价格顾虑仍有 ${intentStat('high','q26','价格较高')}，不能忽略。`,`${intentShort('high')}層の「長時間の保冷ができない」は ${intentStat('high','q22','无法长时间保持低温')}、「車のバッテリー上がりの懸念」は ${intentStat('high','q26','担心车辆电瓶亏电')}。持続冷却と給電の説明を検証する手がかりです。価格懸念も ${intentStat('high','q26','价格较高')} あり、無視できません。`),tables([['q22','当前方式使用痛点','現在の保冷方法の課題'],['q26','未购买原因','未購入の理由']]))+
 intentSection('intent-demand','场景、容量与信息渠道','利用シーン・容量・情報接点',text(`${intentShort('high')}组长途自驾/旅行 ${intentStat('high','q10','长途自驾、旅行、家庭出游或返乡')}、车中泊/露营过夜 ${intentStat('high','q10','车中泊与露营过夜')}；低组对应为 ${intentStat('low','q10','长途自驾、旅行、家庭出游或返乡')}、${intentStat('low','q10','车中泊与露营过夜')}。户外旅行场景是本样本中较突出的分层线索，再结合频率和携带量核对。`,`${intentShort('high')}層の長距離ドライブ・旅行は ${intentStat('high','q10','长途自驾、旅行、家庭出游或返乡')}、車中泊・宿泊キャンプは ${intentStat('high','q10','车中泊与露营过夜')}。低層はそれぞれ ${intentStat('low','q10','长途自驾、旅行、家庭出游或返乡')}、${intentStat('low','q10','车中泊与露营过夜')}。旅行シーンは本サンプルの分類の手がかりで、頻度・携帯量と合わせて確認します。`),tables([['q10','主要使用场景','主な利用シーン'],['q13','保冷需求频率','保冷ニーズの頻度'],['q7','关注或搜索过的容量','関心・検索のある容量'],['q15','一次携带人数','1回の人数分'],['q16','一次携带体积','1回の携帯量'],['q23','了解/搜索渠道','情報収集・検索チャネル']]))+
 intentSection('intent-demo','人口画像与家庭结构','人口属性と世帯構成',intentReadout('q27')+' '+text('年龄、性别与家庭结构应一起阅读；平台构成也不同，不能仅凭一个人口标签筛定目标客群。','年齢・性別・世帯構成を合わせて読みます。プラットフォーム構成も異なるため、人口属性1つでターゲットを確定できません。'),tables([['q27','年龄','年齢'],['q28','性别','性別'],['q29','家庭人数','世帯人数'],['q30','婚姻状况','婚姻状況']]))+
 intentSection('intent-assets','汽车、住房与家庭收入','車・住居・世帯収入',intentReadout('q32')+' '+text('Q32仅覆盖回答车型的人；收入与意愿的并列表现是样本内关联。','Q32は車種の有効回答のみ。所得と意向の比較はサンプル内の関連です。'),tables([['q31','汽车数量','保有車台数'],['q32','常用车型','主に使う車種'],['q33','住房类型','住居形態'],['q34','家庭年收入','世帯年収']]));
}
GROUP_NAV.intent=[['intent-overview','分层概况','分類概要'],['intent-factors','关注因素','重視要素'],['intent-method','方式与满意度','方法と満足度'],['intent-pain','痛点与阻碍','課題と障壁'],['intent-demand','使用需求与渠道','ニーズと接点'],['intent-demo','人口画像','人口属性'],['intent-assets','汽车与收入','車と年収']];
SUBNAV.intent=GROUP_NAV.intent.map(x=>[x[0],x[1]]);
GROUP_NAV.intent.splice(1,0,['intent-comparison','分层比较','分類の比較']);
SUBNAV.intent=GROUP_NAV.intent.map(x=>[x[0],x[1]]);
const _shellBeforeIntent=applyShell;
applyShell=function(){_shellBeforeIntent();document.querySelector('[data-tab="intent"]').textContent=IS_JA?'購入意向別分析':'意愿分层'};
const intentControl=document.createElement('div');intentControl.className='view-filter-options';intentControl.id='intent-filter-options';intentControl.hidden=true;
document.querySelector('#view-filter .view-filter-options').after(intentControl);
const schemeControl=document.createElement('div');schemeControl.id='intent-scheme-options';schemeControl.className='view-filter-options intent-scheme-control';schemeControl.hidden=true;intentControl.before(schemeControl);
schemeControl.addEventListener('click',e=>{const b=e.target.closest('[data-intent-scheme]');if(!b||b.dataset.intentScheme===INTENT_SCHEME)return;const top=scrollY;INTENT_SCHEME=b.dataset.intentScheme;render('intent');scrollTo({top,behavior:'instant'})});
function applyIntentView(){
 schemeControl.innerHTML=`<span>${IS_JA?'分類方法':'分层方案'}</span>`+['new','old'].map(s=>`<button type="button" data-intent-scheme="${s}" aria-pressed="${s===INTENT_SCHEME}">${intentSchemeName(s)}</button>`).join('');
 for(const key of ['low','mid','high','gap'])document.body.classList.toggle('intent-hide-'+key,!INTENT_VIEW[key]);
 intentControl.innerHTML=['low','mid','high','gap'].map(t=>`<button type="button" data-intent-view="${t}" aria-pressed="${INTENT_VIEW[t]}">${intentName(t)}</button>`).join('');
 const count=Object.values(INTENT_VIEW).filter(Boolean).length;
 document.querySelectorAll('.intent-table').forEach(t=>t.style.minWidth=({1:320,2:560,3:760,4:900})[count]+'px');
}
intentControl.addEventListener('click',e=>{const b=e.target.closest('[data-intent-view]');if(!b)return;const key=b.dataset.intentView;if(INTENT_VIEW[key]&&Object.values(INTENT_VIEW).filter(Boolean).length===1)return;INTENT_VIEW[key]=!INTENT_VIEW[key];applyIntentView()});
function syncStickyStack(){
 const tabs=document.querySelector('.tabs'),sub=document.querySelector('#subnav'),filter=document.querySelector('#view-filter');
 const tabHeight=tabs.getBoundingClientRect().height,subHeight=sub.getBoundingClientRect().height;
 sub.style.top=tabHeight+'px';filter.style.top=(tabHeight+subHeight)+'px';
 document.documentElement.style.setProperty('--sticky-clearance',(tabHeight+subHeight+filter.getBoundingClientRect().height+18)+'px');
}
const stickyObserver=new ResizeObserver(syncStickyStack);
['.tabs','#subnav','#view-filter'].forEach(s=>stickyObserver.observe(document.querySelector(s)));
const _renderBeforeIntent=render;
render=function(tab){
 if(tab!=='intent')_renderBeforeIntent(tab);
 else {hideQuestion(true);currentTab=tab;applyShell();document.querySelector('#app').innerHTML=intent();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelector('#n').textContent=D.n;setSubnav(tab);addQuestionBadges(document.querySelector('#app'));document.querySelectorAll('#app [data-jump-id]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.jumpTab,a.dataset.jumpId)})}
 const active=tab==='intent';document.querySelector('#view-filter .view-filter-options').hidden=active;intentControl.hidden=!active;schemeControl.hidden=!active;
 if(active){document.querySelector('[data-filter-label]').textContent=IS_JA?'意向層の表示':'意愿层显示';document.querySelector('[data-filter-note]').textContent=IS_JA?'複数選択可・意向別比較表':'可多选；仅影响意愿分层交叉表';applyIntentView()}
 syncStickyStack();
};
render(currentTab);
const intentHash=decodeURIComponent(location.hash.replace(/^#/,''));if(GROUP_NAV.intent.some(x=>x[0]===intentHash))go('intent',intentHash);
</script></body></html>
